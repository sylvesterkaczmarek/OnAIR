name: Validate extension package initialization
on:
  push:
    branches: ['validation/202-extension-initialization']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.10', '3.12']
    steps:
      - name: Check out validation scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out exact submitted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f5c0ee026ce792fabe8fadf201704c9dd526c4a1
          fetch-depth: 0
          path: source
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install repository dependencies
        run: python -m pip install -r source/requirements.txt -r source/requirements-lint.txt
      - name: Verify fixed and original importers
        run: python validation/verify.py source evidence
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onair-importers-${{ matrix.python }}
          path: evidence/
